site_name: Greenlings
site_description: "A Valheim mod: tame greylings, earn their trust, and teach them your chores."
# Set these once the repo is on GitHub (the Pages workflow builds from this file):
# site_url: https://<user>.github.io/greenlings/
# repo_url: https://github.com/<user>/greenlings
docs_dir: docs
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
  icon:
    logo: material/sprout

nav:
  - Home: index.md
  - Player guide:
      - guide/index.md
      - Taming and trust: guide/taming.md
      - Teaching: guide/teaching.md
      - What they can learn: guide/jobs.md
      - Shamans: guide/shamans.md
      - Left to themselves: guide/free-time.md
      - Personalities: guide/traits.md
      - Upkeep: guide/upkeep.md
      - Danger: guide/danger.md
      - Configuration: guide/config.md
  - Project:
      - project/index.md
      - Implementation status: project/status.md
      - Roadmap: project/roadmap.md
      - Changelog: project/changelog.md
  - Development:
      - dev/index.md
      - Architecture: dev/architecture.md
      - Dev loop and harness: dev/harness.md
      - Scenario tests: dev/tests.md
      - Playtesting: dev/playtest.md
      - Writing the wiki: dev/wiki.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.tasklist: { custom_checkbox: true }

extra_css:
  - assets/extra.css
